name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Exercise real Electron security and recovery boundaries
        run: npm run test:security:electron

      - name: Validate pets
        shell: bash
        run: for p in pets/*.pet.js; do node scripts/validate-pet.js "$p" || exit 1; done

      - name: Build unpacked distribution
        run: npm run dist:win

      - name: Smoke test unpacked app (HARNESS_PET_MENUTEST=1)
        run: npm run test:smoke:menu

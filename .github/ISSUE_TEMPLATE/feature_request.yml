name: Idea or feature request
description: Suggest something new or better
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do that's hard or impossible today?

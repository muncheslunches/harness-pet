[package]
name = "harness-pet-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Small Windows helpers for Harness Pet. See ../win-helper.ps1 and ../key-watch.ps1 for the PowerShell versions they replace."

[[bin]]
name = "harness-pet-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "harness-pet-keywatch"
path = "src/bin/keywatch.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
